<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>เข้าสู่ระบบ — TITAN</title>
<script src="/platform/qrcode.min.js"></script>
<style>
  :root{--bg:#080a0f;--panel:#0e131b;--panel2:#141b26;--line:#1e2735;--line2:#2a3648;
    --fg:#e8eef7;--muted:#8496ad;--dim:#5a6b83;--accent:#3b82f6;--up:#0ecb81;--down:#f6465d}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);min-height:100vh;display:grid;place-items:center;
    padding:24px;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Noto Sans Thai",sans-serif;
    -webkit-font-smoothing:antialiased}
  .box{width:100%;max-width:390px}
  .brand{font-size:17px;font-weight:700;letter-spacing:3px;text-align:center;margin-bottom:6px}
  .brand em{color:var(--accent);font-style:normal}
  .sub{color:var(--muted);font-size:12.5px;text-align:center;margin-bottom:26px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px}
  h2{font-size:15px;font-weight:650;margin-bottom:18px}
  label{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;
    letter-spacing:.8px;font-weight:700;margin-bottom:6px}
  input{width:100%;background:var(--panel2);border:1px solid var(--line2);color:var(--fg);
    border-radius:10px;padding:11px 13px;font:inherit;outline:none;margin-bottom:14px}
  input:focus{border-color:var(--accent)}
  .code{display:flex;gap:8px;align-items:center}
  .code input{font-size:22px;letter-spacing:8px;text-align:center;font-family:ui-monospace,monospace;
    margin-bottom:14px;padding:9px}
  .code .live{font-size:11.5px;color:var(--up);white-space:nowrap;font-family:ui-monospace,monospace}
  button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:12px;font:inherit;font-weight:650;cursor:pointer;margin-top:4px}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.g{background:var(--panel2);border:1px solid var(--line2);color:var(--fg);margin-top:10px}
  .msg{padding:10px 13px;border-radius:9px;font-size:12.5px;margin-bottom:14px;line-height:1.6}
  .msg.err{background:#2b0f14;color:var(--down);border:1px solid #5a2029}
  .msg.ok{background:#0a2b26;color:var(--up);border:1px solid #12463a}
  .secret{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:12px;
    font-family:ui-monospace,monospace;font-size:15px;letter-spacing:2px;text-align:center;
    word-break:break-all;margin:10px 0}
  .qrbox{background:#fff;border-radius:12px;padding:12px;display:grid;place-items:center;margin:6px 0 12px}
  .qrbox canvas{display:block;width:190px;height:190px;image-rendering:pixelated}
  .or{text-align:center;color:var(--dim);font-size:11px;text-transform:uppercase;
    letter-spacing:1px;margin:16px 0 4px}
  .hint{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:8px}
  a{color:var(--accent);text-decoration:none;font-size:12.5px}
  .uri{font-size:10.5px;color:var(--dim);word-break:break-all;margin-top:10px;line-height:1.5}
  ol{font-size:12.5px;color:var(--muted);line-height:1.9;padding-left:20px;margin-top:10px}
  .off{text-align:center;color:var(--muted);font-size:12.5px;padding:14px 0}
</style>
</head>
<body>
<div class="box">
  <div class="brand">TITAN<em>·</em>MT5</div>
  <div class="sub">แผนกอบควบคุมการเทรดอัตโนมัติ</div>
  <div class="card" id="card"><div class="off">กำลังตรวจสอบ…</div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const post=async(p,b)=>{const r=await fetch('/api'+p,{method:'POST',
  headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{}),credentials:'same-origin'});
  const t=await r.text();
  let d; try{d=JSON.parse(t);}catch(e){throw new Error(t.slice(0,140)||'HTTP '+r.status);}
  if(!r.ok) throw new Error(d.detail||('HTTP '+r.status));
  return d;};

let MODE='login', ENROLL={}, TIMER=null;

function liveCountdown(){
  if(TIMER) clearInterval(TIMER);
  TIMER=setInterval(()=>{
    const e=$('cd'); if(!e) return;
    const s=30-(Math.floor(Date.now()/1000)%30);
    e.textContent='อีก '+s+' วิ';
  },1000);
}

function renderLogin(msg, kind){
  $('card').innerHTML='<h2>เข้าสู่ระบบ</h2>'
    +(msg?'<div class="msg '+kind+'">'+esc(msg)+'</div>':'')
    +'<form id="f">'
    +'<label>อีเมล</label><input id="em" type="email" autocomplete="username" value="'+esc(window.__em||'')+'" required>'
    +'<label>รหัสผ่าน</label><input id="pw" type="password" autocomplete="current-password" required>'
    +'<label>รหัสจาก Google Authenticator</label>'
    +'<div class="code"><input id="cd" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" '
    +'autocomplete="one-time-code" placeholder="000000" required><span class="live" id="cdt"></span></div>'
    +'<button type="submit">เข้าสู่ระบบ</button></form>'
    +'<a href="#" id="enrollLink">ยังไม่ได้ตั้ง Google Authenticator — ตั้งค่าตอนนี้</a>';
  $('f').onsubmit=async e=>{
    e.preventDefault(); const b=$('f');
    b.querySelector('button').disabled=true;
    try{ await post('/auth/login',{email:$('em').value,password:$('pw').value,code:$('cd').value});
      location.href='/platform/';
    }catch(err){ b.querySelector('button').disabled=false; renderLogin(err.message,'err'); }
  };
  $('enrollLink').onclick=e=>{e.preventDefault();renderEnrollStep1();};
  liveCountdown();
}

function renderEnrollStep1(){
  $('card').innerHTML='<h2>ตั้งค่า Google Authenticator</h2>'
    +'<div class="hint">สร้างบัญชีและรหัสผ่านก่อน — จะได้ secret มาสแกน</div><br>'
    +'<form id="f1">'
    +'<label>อีเมล</label><input id="em" type="email" value="'+esc(window.__em||'')+'" required>'
    +'<label>รหัสผ่าน (อย่างน้อย 10 ตัว)</label>'
    +'<input id="pw" type="password" autocomplete="new-password" minlength="10" required>'
    +'<label>ยืนยันรหัสผ่าน</label>'
    +'<input id="pw2" type="password" autocomplete="new-password" minlength="10" required>'
    +'<div id="tokWrap" style="display:none"><label>Setup Token (ถ้าตั้งค่าไปแล้ว)</label>'
    +'<input id="tok" type="password" autocomplete="off"></div>'
    +'<button type="submit">สร้างและรับ Secret</button>'
    +'<button type="button" class="g" id="back">ย้อนกลับ</button></form>';
  $('f1').onsubmit=async e=>{
    e.preventDefault();
    if($('pw').value!==$('pw2').value){ alert('รหัสผ่านทั้งสองไม่ตรงกัน'); return; }
    const b=$('f1'); b.querySelector('button').disabled=true;
    try{ ENROLL=await post('/auth/enroll',{email:$('em').value,password:$('pw').value,
          setup_token:($('tok')||{}).value||''});
      renderEnrollStep2();
    }catch(err){ b.querySelector('button').disabled=false;
      if(/ตั้งค่าแล้ว/.test(err.message)) $('tokWrap').style.display='block';
      alert(err.message); }
  };
  $('back').onclick=()=>renderLogin();
}

function renderEnrollStep2(){
  $('card').innerHTML='<h2>สแกนด้วย Google Authenticator</h2>'
    +'<div class="qrbox"><canvas id="qr"></canvas></div>'
    +'<div class="hint" style="text-align:center">สแกน QR ด้วยแอป Google Authenticator '
    +'(กด + → Scan a QR code)</div>'
    +'<div class="or">หรือกรอกด้วยมือ</div>'
    +'<div class="secret">'+esc(ENROLL.secret)+'</div>'
    +'<div class="hint">กรอก code 6 หลักจากแอปเพื่อยืนยันการตั้งค่า</div>'
    +'<form id="f2" style="margin-top:14px">'
    +'<label>รหัส 6 หลักจากแอป</label>'
    +'<div class="code"><input id="cd" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" '
    +'placeholder="000000" required><span class="live" id="cdt"></span></div>'
    +'<button type="submit">ยืนยันและเปิดใช้</button></form>'
    +'<div class="uri">otpauth URI (สำรอง):<br>'+esc(ENROLL.otpauth_uri)+'</div>';
  drawQR(ENROLL.otpauth_uri);
  $('f2').onsubmit=async e=>{
    e.preventDefault(); const b=$('f2');
    b.querySelector('button').disabled=true;
    try{ await post('/auth/enroll/confirm',{email:ENROLL.email,code:$('cd').value});
      ENROLL={}; renderLogin('ตั้งค่าสำเร็จ — เข้าสู่ระบบได้เลย','ok');
    }catch(err){ b.querySelector('button').disabled=false; renderEnrollStep2();
      $('card').insertAdjacentHTML('afterbegin','<div class="msg err">'+esc(err.message)+'</div>'); }
  };
  liveCountdown();
}

/* Render the otpauth URI as a QR entirely in the browser — the secret never
   leaves the machine, so no third-party QR image service is involved. */
function drawQR(text){
  const cv=$('qr'); if(!cv) return;
  try{
    const qr=qrcode(0,'M'); qr.addData(text); qr.make();
    const n=qr.getModuleCount(), scale=6, quiet=4;
    const size=(n+quiet*2)*scale;
    cv.width=size; cv.height=size;
    const ctx=cv.getContext('2d');
    ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,size,size);
    ctx.fillStyle='#000000';
    for(let r=0;r<n;r++) for(let c=0;c<n;c++){
      if(qr.isDark(r,c)) ctx.fillRect((c+quiet)*scale,(r+quiet)*scale,scale,scale);
    }
  }catch(e){ /* QR is a convenience; the secret below it is always shown */ }
}

(async function(){
  try{
    const s=await fetch('/api/auth/status',{credentials:'same-origin'}).then(r=>r.json());
    if(!s.enabled){
      $('card').innerHTML='<div class="off">ระบบล็อกอินยังไม่ได้เปิดใช้งาน<br><br>'
        +'<a href="/platform/">ไปที่หน้าแพลตฟอร์ม →</a></div>';
      return;
    }
    window.__em=s.user||'';
    if(!s.enrolled){ renderEnrollStep1(); }
    else { renderLogin(); }
  }catch(e){ $('card').innerHTML='<div class="msg err">โหลดไม่สำเร็จ: '+esc(e.message)+'</div>'; }
})();
</script>
</body>
</html>
